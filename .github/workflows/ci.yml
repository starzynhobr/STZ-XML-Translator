name: CI

# The release workflow only runs on tags; this catches a regression on the
# push or pull request that introduces it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  python:
    name: Lint and test (Python)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

  desktop:
    name: Type-check and build (desktop UI)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test engine supervisor
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  e2e:
    name: End-to-end (UI in Edge against the real engine)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install UI dependencies
        working-directory: desktop
        run: npm ci

      # Edge ships with the runner, so no browser download is needed.
      - name: Run the flow tests
        working-directory: desktop
        env:
          STZ_PYTHON: python
        run: npx playwright test

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: desktop/test-results
