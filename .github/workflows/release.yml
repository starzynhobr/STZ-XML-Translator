# GITHUB_TOKEN is provided automatically by GitHub Actions.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

defaults:
  run:
    shell: powershell

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      # Fetches the repository contents for the tagged release.
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the Python runtime used by the desktop app and test suite.
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs app and build dependencies from pyproject.toml.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Runs the test suite before any release artifact is built.
      - name: Run tests
        run: python -m pytest

      # Converts the source PNG icon into the ICO file consumed by Nuitka.
      - name: Prepare Windows icon
        run: |
          python -c "from PIL import Image; img=Image.open('assets/stz-xml.png').convert('RGBA'); img.save('assets/icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      # Reads the canonical version and rejects tags or package metadata that diverge.
      - name: Validate release version
        run: |
          $declaration = Select-String -Path ".\build_nuitka.bat" -Pattern '^\s*set APP_VERSION=(\d+\.\d+\.\d+\.\d+)\s*$'
          if (-not $declaration) {
            throw "APP_VERSION was not found in build_nuitka.bat."
          }
          $appVersion = $declaration.Matches[0].Groups[1].Value
          if ($appVersion -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "APP_VERSION must use X.Y.Z.0 for a release. Got: $appVersion"
          }
          $version = $appVersion -replace '\.0$', ''
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $version) {
            throw "Release tag v$tagVersion does not match canonical version v$version."
          }
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($projectVersion -ne $version) {
            throw "pyproject.toml version $projectVersion does not match canonical version $version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_SEMVER=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VERSION=$version"
          Write-Host "APP_VERSION=$appVersion"

      # Builds the standalone executable with static Nuitka flags read from main_qt.py.
      - name: Build executable with Nuitka
        run: |
          Set-Content -Path ".\core\_build_version.py" -Value "BUILD_VERSION = `"$env:APP_VERSION`"" -Encoding ascii
          python -m nuitka `
            --jobs=$env:NUMBER_OF_PROCESSORS `
            --file-version=$env:APP_VERSION `
            --product-version=$env:APP_VERSION `
            main_qt.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build desktop shell
        working-directory: desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed" }
          Copy-Item "src-tauri\target\release\stz-xml-translator.exe" "..\dist\main_qt.dist\stz-xml-translator.exe"

      - name: Build Inno Setup installer
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          & $iscc ".\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Build portable archive and checksums
        run: |
          $setup = "dist\STZXMLTranslator-Setup-$env:VERSION.exe"
          $portable = "dist\STZXMLTranslator-Portable-$env:VERSION.zip"
          if (-not (Test-Path $setup)) {
            throw "Missing installer: $setup"
          }
          Compress-Archive -Path ".\dist\main_qt.dist\*" -DestinationPath $portable -CompressionLevel Optimal
          foreach ($asset in @($setup, $portable)) {
            $hash = (Get-FileHash -Path $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))" | Set-Content "$asset.sha256" -Encoding ascii
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "dist\STZXMLTranslator-Setup-$env:VERSION.exe"
          $portable = "dist\STZXMLTranslator-Portable-$env:VERSION.zip"
          $assets = @($setup, "$setup.sha256", $portable, "$portable.sha256")

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              throw "Missing release asset: $asset"
            }
          }

          $notes = "docs/release-notes/${{ github.ref_name }}.md"
          $notesArgs = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          gh release create "${{ github.ref_name }}" `
            $assets `
            --title "STZ XML Translator $env:VERSION" `
            @notesArgs `
            --latest
